name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Test
        working-directory: core-engine
        run: |
          go test ./...
          go vet ./...
      - name: Verify committed AAR hash
        run: |
          got="$(sha256sum app/libs/libtailcat.aar | awk '{print $1}')"
          want="$(tr -d ' \n' < app/libs/libtailcat.aar.sha256)"
          if [ "$got" != "$want" ]; then
            echo "AAR hash $got does not match app/libs/libtailcat.aar.sha256 ($want)"
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest lintDebug
