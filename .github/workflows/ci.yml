name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: Test
        working-directory: core-engine
        run: |
          go test -race ./...
          go vet ./...
      - name: gofmt
        working-directory: core-engine
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: staticcheck
        working-directory: core-engine
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        working-directory: core-engine
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Phase 8 analyzer synthetic e2e
        run: scripts/phase8/e2e-analyze.sh
      - name: Verify committed AAR hash
        run: |
          got="$(sha256sum app/libs/libtailcat.aar | awk '{print $1}')"
          want="$(tr -d ' \n' < app/libs/libtailcat.aar.sha256)"
          if [ "$got" != "$want" ]; then
            echo "AAR hash $got does not match app/libs/libtailcat.aar.sha256 ($want)"
            exit 1
          fi
      - name: Verify AAR matches native source tree
        run: |
          got="$(find core-engine third_party \
            -type f \
            ! -path '*/.git/*' \
            ! -name .git \
            ! -name '*.aar' \
            ! -name '*.aar.sha256' \
            ! -path '*/build/*' \
            -print0 |
            LC_ALL=C sort -z |
            xargs -0 sha256sum |
            sha256sum |
            awk '{print $1}')"
          want="$(tr -d ' \n' < app/libs/libtailcat.aar.sourcehash)"
          if [ "$got" != "$want" ]; then
            echo "Native source hash $got does not match app/libs/libtailcat.aar.sourcehash ($want)."
            echo "Rebuild with core-engine/build-aar.sh so the checked-in AAR tracks its source."
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Unit tests
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Build optimized development APKs
        run: ./gradlew assembleDevelopment
