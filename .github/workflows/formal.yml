name: formal

# TLC model check of the lifecycle model (formal/). Runs every config, split
# across parallel shards, and fails unless each behaves as its EXPECT line.
on:
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "app/src/main/java/com/tailcat/vpn/service/**"
      - "core-engine/lifecycle.go"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "formal/**"
      - "app/src/main/java/com/tailcat/vpn/service/**"
      - "core-engine/lifecycle.go"
      - ".github/workflows/formal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: PlusCal translation is up to date
        run: |
          formal/check.sh --translate
          git diff --exit-code -- formal/Lifecycle.tla \
            || { echo "Run formal/check.sh --translate and commit Lifecycle.tla"; exit 1; }

  tlc:
    needs: translation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: TLC (shard ${{ matrix.shard }} of 6)
        env:
          TLC_XMX: 4g
          TLC_DIRECT: 1g
        run: formal/check.sh --shard ${{ matrix.shard }}/6
      - name: Upload TLC logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tlc-logs-shard-${{ matrix.shard }}
          path: formal/.tools/logs/
          retention-days: 14
